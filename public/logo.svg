<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#646668" />
      <stop offset="100%" stop-color="#4a4c4e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Círculo de fondo con un ligero degradado y sombra -->
  <circle cx="200" cy="200" r="160" fill="url(#circleGrad)" filter="url(#shadow)" stroke="#444" stroke-width="1.5"/>
  
  <!-- Texto "UT" con inclinación (skew) y rotación -->
  <g transform="translate(195, 240) skewX(-15) rotate(-5)">
    <text font-family="'Arial Black', 'Helvetica Black', sans-serif" font-weight="900" font-size="150" fill="white" text-anchor="middle" letter-spacing="-2">UT</text>
  </g>
</svg>
